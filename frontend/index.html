<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Temporary Pastebin: text and code that deletes itself</title>
    <meta
      name="description"
      content="Paste text or code and share the link. Each paste is deleted after 10 minutes or 1 hour. No account needed."
    />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="https://pastebin.ysinghc.in/" />
    <meta name="application-name" content="Pastebin" />
    <meta name="theme-color" content="#e8ebea" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Link previews in chat apps and social feeds. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Pastebin" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://pastebin.ysinghc.in/" />
    <meta property="og:title" content="Temporary Pastebin: text and code that deletes itself" />
    <meta
      property="og:description"
      content="Paste text or code and share the link. Each paste is deleted after 10 minutes or 1 hour. No account needed."
    />
    <meta property="og:image" content="https://pastebin.ysinghc.in/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Pastebin wordmark above the headline &quot;Text that deletes itself.&quot;" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Temporary Pastebin: text and code that deletes itself" />
    <meta
      name="twitter:description"
      content="Paste text or code and share the link. Each paste is deleted after 10 minutes or 1 hour. No account needed."
    />
    <meta name="twitter:image" content="https://pastebin.ysinghc.in/og-image.png" />
    <meta name="twitter:image:alt" content="Pastebin wordmark above the headline &quot;Text that deletes itself.&quot;" />

    <!-- Describes the app to search engines. Deliberately no SearchAction: Google retired the sitelinks search box in 2024. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://pastebin.ysinghc.in/#website",
            "name": "Pastebin",
            "url": "https://pastebin.ysinghc.in/",
            "description": "Paste text or code and share the link. Each paste is deleted after 10 minutes or 1 hour.",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://pastebin.ysinghc.in/#app",
            "name": "Pastebin",
            "url": "https://pastebin.ysinghc.in/",
            "description": "Paste text or code and share the link. Each paste is deleted after 10 minutes or 1 hour. No account needed.",
            "applicationCategory": "DeveloperApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires a web browser with JavaScript enabled",
            "isAccessibleForFree": true,
            "offers": {
              "@type": "Offer",
              "price": "0",
              "priceCurrency": "USD"
            }
          }
        ]
      }
    </script>
    <link rel="preconnect" href="https://ysinghc-pastebin-api.hf.space" crossorigin />
    <script>
      // Apply a saved theme choice before first paint so the page never flashes.
      try {
        var theme = JSON.parse(localStorage.getItem('pastebin:theme'));
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Shown without JavaScript, and read by crawlers that do not run it (many AI crawlers do not). -->
    <noscript>
      <h1>Temporary Pastebin: text and code that deletes itself</h1>
      <p>Paste text or code and share the link. Each paste is deleted after 10 minutes or 1 hour. No account needed.</p>
      <p>Pastebin needs JavaScript to publish and open pastes.</p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
