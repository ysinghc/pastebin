[project]
name = "pastebin"
version = "0.1.0"
description = "Backend for an online clipboard"
readme = "README.md"
authors = [
    { name = "Yuvraj Singh Chauhan", email = "ysinghcin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "python-dotenv>=1.2.2",
    "redis>=8.0.0",
    "uvicorn>=0.49.0",
]

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"
